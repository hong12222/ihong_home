<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>正在准备 — 跳转到自我介绍</title>
  <meta name="description" content="跳转到我的自我介绍页 — 立即跳转并显示目标链接（无动画）。">
  <style>
    :root{--bg1:#071026;--bg2:#061b32;--text:#eaf2ff;--muted:#9fb0c8;--accent:#7c3aed}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;color:var(--text);background:linear-gradient(180deg,var(--bg1),var(--bg2));}
    body{display:flex;align-items:center;justify-content:center;padding:24px}
    .card{max-width:820px;width:100%;padding:28px;border-radius:12px;background:rgba(255,255,255,0.02);box-shadow:0 10px 30px rgba(0,0,0,0.4)}
    h1{margin:0;font-size:20px}
    .subtitle{color:var(--muted);margin-top:6px;font-size:13px}
    .destBox{margin-top:20px;padding:18px;border-radius:10px;background:rgba(255,255,255,0.01);border:1px solid rgba(255,255,255,0.03);display:flex;flex-direction:column;gap:8px}
    .destUrl{font-weight:700;color:var(--accent);word-break:break-all}
    .actions{margin-top:16px;display:flex;gap:10px}
    .btn{appearance:none;border:0;padding:10px 14px;border-radius:10px;background:linear-gradient(90deg,#ff9a8b,#fecf6a);color:#04263b;font-weight:700;cursor:pointer}
    .link{color:var(--accent);text-decoration:none;font-weight:700}
    .muted{color:var(--muted)}
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="heading">
    <h1 id="heading">准备前往我的自我介绍</h1>
    <div class="subtitle">为避免 404，我会在下面显示将要前往的目标并立即跳转（支持 ?dest= 覆盖）。</div>

    <div class="destBox" id="destBox" aria-live="polite">
      <div class="muted">目标站点：</div>
      <div class="destUrl" id="destUrl">--</div>
      <div class="muted" id="notice">正在准备跳转…</div>
    </div>

    <div class="actions">
      <button id="openBtn" class="btn">立即打开</button>
      <a id="openNew" class="link" href="#" target="_blank" rel="noopener noreferrer">在新窗口打开</a>
    </div>

    <div style="margin-top:12px;color:var(--muted);font-size:13px">无 JS 回退：<noscript><a href="i泓主页.html" class="link">前往自我介绍 (i泓主页.html)</a></noscript></div>
  </main>

  <script>
    // 修复说明：原先默认目标为 intro.html，但仓库中实际文件名为 i泓主页.html。
    // 本次修改：将默认目标改为 i泓主页.html；页面在加载时立即显示目标并执行跳转（不播放动画）。

    const DEFAULT_DEST = 'i泓主页.html';

    function getQueryParam(name){ try{ const params = new URLSearchParams(location.search); return params.get(name);}catch(e){return null} }
    const destParam = getQueryParam('dest');
    const DEST = destParam ? decodeURIComponent(destParam) : DEFAULT_DEST;

    const destUrlEl = document.getElementById('destUrl');
    const noticeEl = document.getElementById('notice');
    const openBtn = document.getElementById('openBtn');
    const openNew = document.getElementById('openNew');

    // 显示目标（可见给用户）
    destUrlEl.textContent = DEST;
    openNew.href = DEST;

    // 立即跳转（不做动画占用时间）
    // 为了让用户看到目标文字（极短时间），先让浏览器完成渲染再跳转。
    // 使用 requestAnimationFrame 两次可以保证一次微小延迟但立即跳转且不会显示动画。
    function doRedirect(){
      try{
        // 若用户手动点击“立即打开”，优先使用该操作
        openBtn.addEventListener('click', ()=>{ window.location.href = DEST });
        openNew.addEventListener('click', ()=>{ /* link has href */ });

        // 首先将提示改为明确的目标信息
        noticeEl.textContent = '即将前往：' + DEST;

        // 在下一个帧跳转，浏览器会先渲染上面的文字
        requestAnimationFrame(()=> requestAnimationFrame(()=> { window.location.href = DEST }));
      }catch(e){
        // 如果跳转失败，给出可点击链接
        noticeEl.innerHTML = '无法自动跳转，请点击： <a class="link" href="' + DEST + '">' + DEST + '</a>';
      }
    }

    // 一旦 DOM 可用就执行跳转
    if (document.readyState === 'complete' || document.readyState === 'interactive'){
      doRedirect();
    } else {
      window.addEventListener('DOMContentLoaded', doRedirect);
    }
  </script>
</body>
</html>
